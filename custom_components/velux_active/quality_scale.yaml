# Local engineering ledger for this Custom integration; no official tier claim.
# Evidence paths are relative to the repository root. No exemptions are claimed.
rules:
  # Bronze
  action-setup:
    status: done
    comment: async_setup owns registration; test_first_refresh_validates_setup_before_entities and test_action_is_registered_without_entry_and_survives_unload.
  appropriate-polling:
    status: done
    comment: coordinator.py uses one-minute cloud polling and honors Retry-After; README Rain data and refresh, test_action_failure_backoff_and_automatic_recovery.
  brands:
    status: done
    comment: Original MIT PNGs in brand/ with scripts/brand.py and assets/README.md; current HACS brands validator passes local tree, hassfest passes, packaged lab checks served icon bytes/MIME.
  common-modules:
    status: done
    comment: coordinator.py owns polling; entity.py owns common snapshot identity and availability; test_entities.py.
  config-flow-test-coverage:
    status: done
    comment: test_cloud.py and test_quality.py cover user, reauth, reconfigure and failure branches; check_coverage.py requires 100% lines and branches.
  config-flow:
    status: done
    comment: Native UI user/password renewal flows in config_flow.py; test_native_user_flow_distinguishes_authentication_from_outage.
  dependency-transparency:
    status: done
    comment: Public MIT inline api.py and HA-provided dependencies documented in CONTRIBUTING Dependency and asset provenance; no empty-requirements exemption.
  docs-actions:
    status: done
    comment: README Actions, triggers, and conditions and Rain data and refresh describe zero-argument refresh, completed work and errors.
  docs-triggers:
    status: done
    comment: README Actions, triggers, and conditions states no custom triggers and explains standard entity state triggers.
  docs-conditions:
    status: done
    comment: README Actions, triggers, and conditions states no custom conditions and explains standard entity state conditions.
  docs-high-level-description:
    status: done
    comment: README introduction describes read-only VELUX cloud functionality and entity platforms.
  docs-installation-instructions:
    status: done
    comment: README Install or update contains HACS and manual installation steps and prerequisites.
  docs-removal-instructions:
    status: done
    comment: README Remove describes entry, HACS/code removal and restart.
  entity-event-setup:
    status: done
    comment: CoordinatorEntity supplies subscriptions in native lifecycle; test_failed_unload_preserves_resources_and_successful_unload_cancels_owned_work and native pytest cleanup checks.
  entity-unique-id:
    status: done
    comment: test_synthetic_legacy_v1_registry_preserved_by_update_reload_and_reauth preserves original unique IDs, registry names and disabled preferences.
  has-entity-name:
    status: done
    comment: entity.py sets has_entity_name, entity-only measurement names and cover name=None; test_missing_devices_and_measurements_never_retain_previous_snapshot.
  runtime-data:
    status: done
    comment: Typed VeluxActiveConfigEntry alias in coordinator.py is used in setup/unload/platform signatures; tests exercise entry.runtime_data.
  test-before-configure:
    status: done
    comment: authenticate and get_home_data run before creating/updating entry; test_native_user_flow_distinguishes_authentication_from_outage and renewal failure tests.
  test-before-setup:
    status: done
    comment: First coordinator refresh precedes entity setup; test_first_refresh_validates_setup_before_entities covers auth and transient failure.
  unique-config-entry:
    status: done
    comment: manifest single_config_entry uses HA-native enforcement; test_single_entry_rejects_duplicate_user_flow.
  # Silver
  action-exceptions:
    status: done
    comment: test_action_failure_backoff_and_automatic_recovery, test_action_authentication_failure_starts_reauth, and unload/cancellation tests assert real errors.
  config-entry-unloading:
    status: done
    comment: Native platform unloading, coordinator cleanup and entry-owned request cancellation; test_native_failed_unload_reports_framework_state_and_rejects_action and successful unload test.
  docs-configuration-parameters:
    status: done
    comment: README Installation and configuration parameters lists credentials, fixed polling, password renewal and single-account limits.
  docs-installation-parameters:
    status: done
    comment: README Installation and configuration parameters lists gateway/account, HA version and HTTPS prerequisites; no local address or OAuth registration.
  entity-unavailable:
    status: done
    comment: test_entities.py covers connectivity false, missing devices/data, zero/false and typed timestamps; native outage tests prove recovery.
  integration-owner:
    status: done
    comment: manifest codeowners includes @mikz and issue_tracker links this repository.
  log-when-unavailable:
    status: done
    comment: Native coordinator logs once per outage/recovery; test_action_failure_backoff_and_automatic_recovery verifies counts without added logs.
  parallel-updates:
    status: done
    comment: PARALLEL_UPDATES=0 in all three read-only coordinator platforms; shared refresh test proves one concurrent cloud operation.
  reauthentication-flow:
    status: done
    comment: test_account_renewal_rejects_switch_and_preserves_credentials_on_failures covers same-login renewal, invalid auth, transient failure and recovery for both renewal flows.
  test-coverage:
    status: done
    comment: Locked source CI runs branch coverage over all integration modules and check_coverage.py requires each module above 95%; config_flow requires 100%.
