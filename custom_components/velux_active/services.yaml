refresh:
  name: Refresh
  description: Request fresh VELUX cloud status for all configured homes.
open_during_rain:
  name: Open temporarily during rain
  description: Override rain protection once (up to 50%). VELUX closes after 15 minutes. Repeated calls can renew the override and admit rain. Requires gateway pairing and reported rain.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: velux_active
          domain: cover
    position:
      required: true
      selector:
        number:
          min: 1
          max: 50
          step: 1
          unit_of_measurement: "%"
