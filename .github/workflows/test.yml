name: Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.14.7'
      - run: uv sync --locked
      - run: uv run python scripts/prepare_client_artifacts.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=custom_components.velux_active --cov=velux_active_client --cov-branch --cov-report=term-missing --cov-report=json:artifacts/source-coverage.json
      - run: uv run python scripts/check_coverage.py artifacts/source-coverage.json
      - run: uv run mypy
      - run: uv run python scripts/release.py build
      - run: uv run python scripts/release.py verify
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ha: ['2026.9.3', '2026.9.4']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-docker-action@v5
        with:
          version: v29.4.0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run python scripts/prepare_client_artifacts.py
      - run: python scripts/release.py build
      - run: python scripts/lab.py prepare --ha-version '${{ matrix.ha }}'
      - run: python scripts/lab.py test --ha-version '${{ matrix.ha }}'
