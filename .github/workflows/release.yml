name: Release
on:
  release:
    types: [published]
permissions: {}
jobs:
  release:
    if: ${{ !startsWith(github.event.release.tag_name, 'client-v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'
      - name: Build the same deterministic archive used by the lab
        run: python scripts/release.py build
      - uses: softprops/action-gh-release@v2.0.8
        with:
          files: |
            dist/velux_active.zip
            dist/velux_active.manifest.json
