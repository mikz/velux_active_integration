name: "Lint"

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  ruff:
    name: "Ruff"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v7.0.1"

        - uses: astral-sh/setup-uv@v10.2.0
          with:
            python-version: '3.14.7'

        - run: uv sync --locked

        - name: "Lint"
          run: uv run ruff check .

        - name: "Format"
          run: uv run ruff format . --check
