[project]
name = "velux-active-integration"
version = "0.2.0"
requires-python = ">=3.14.2,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pytest-homeassistant-custom-component==0.13.367",
  "ruff==0.15.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/integration"]
addopts = "--strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/velux_active"]
